<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1700" width="600" height="1700">
  <!-- Deliberately tall, like the scanned page in issue #34: on a sheet this
       shape a rating bar at the foot of the surface is a scroll away from a line
       revealed near the top. -->
  <rect width="600" height="1700" fill="#fbfaf6"/>
  <text x="36" y="118" font-family="sans-serif" font-size="30" font-weight="bold" fill="#2b2a27">Inspection sheet — Span 4</text>
  <text x="530" y="530" font-family="sans-serif" font-size="22" fill="#2b2a27">OK</text>
  <text x="36" y="300" font-family="sans-serif" font-size="22" fill="#2b2a27">1. Bearing plate — east abutment</text>
  <line x1="36" y1="314" x2="564" y2="314" stroke="#d8d3c6" stroke-width="1"/>
