{% extends "base.html" %}
{#- The section nav is rendered inline in the header (see partials/header.html),
    so the standalone tabs bar below the header is dropped. -#}
{% block tabs %}{% endblock %}
{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="Osmosis">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ config.site_url }}">
  <!-- MEDIA SWAP: replace with the dedicated 1200x630 social card -->
  <meta property="og:image" content="{{ config.site_url }}/assets/media/osmosis_note_mind_map_split_view_zoomed.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Osmosis">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}/assets/media/osmosis_note_mind_map_split_view_zoomed.png">
{% endblock %}
